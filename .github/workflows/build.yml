name: Build and type-check
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify publishable Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL repository variable"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }
      - run: npm run syntax
      - run: npm run contracts
      - run: npm run check
      - name: Run regression suite and report all failures
        run: |
          failures=0
          npm run test:inventory-errors || failures=$((failures+1))
          for script in scripts/test-effect-editor-render.mjs scripts/test-page-navigation.mjs scripts/test-player-login-character-list.mjs scripts/test-equipment-requirements.mjs scripts/test-loadout-health.mjs scripts/test-inventory-ui-refinements.mjs scripts/test-inventory-workbench.mjs scripts/test-inventory-milestones-6-31-to-6-35.mjs scripts/test-stack-management.mjs scripts/test-automatic-stacking.mjs scripts/test-item-consumption.mjs scripts/test-healing-potion.mjs scripts/test-healing-potion-tiers.mjs scripts/test-character-hp-quick-adjust.mjs scripts/test-character-potion-hotbar.mjs scripts/test-combat-milestones-7-1-to-7-5.mjs scripts/test-custom-item-use-effects.mjs scripts/test-compact-character-ui.mjs scripts/test-attribute-effect-popups.mjs scripts/test-character-rest-7-6.mjs scripts/test-character-currency-7-7.mjs scripts/test-campaign-merchants-7-8.mjs scripts/test-qr-loot-7-9.mjs scripts/test-character-crafting-7-10.mjs scripts/test-crafting-required-tools-7-11.mjs scripts/test-crafting-checks-7-12.mjs scripts/test-crafting-professions-redesign.mjs scripts/test-ingredient-stacking-settings.mjs scripts/test-gm-dashboard-loot-currency-updates.mjs; do
            echo "::group::Testing $script"
            node "$script" || { echo "::error title=Regression failed::$script"; failures=$((failures+1)); }
            echo "::endgroup::"
          done
          echo "Regression failures: $failures"
          test "$failures" -eq 0
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ttrpg-dist
          path: dist/
