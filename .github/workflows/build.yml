name: Build and type-check
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify publishable Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL repository variable"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }
      - run: npm run syntax
      - run: npm run contracts
      - run: npm run check
      - run: npm run test:inventory-errors
      - run: node scripts/test-effect-editor-render.mjs
      - run: node scripts/test-page-navigation.mjs
      - run: node scripts/test-equipment-requirements.mjs
      - run: node scripts/test-loadout-health.mjs
      - run: node scripts/test-inventory-ui-refinements.mjs
      - run: node scripts/test-inventory-workbench.mjs
      - run: node scripts/test-inventory-milestones-6-31-to-6-35.mjs
      - run: node scripts/test-stack-management.mjs
      - run: node scripts/test-automatic-stacking.mjs
      - run: node scripts/test-item-consumption.mjs
      - run: node scripts/test-healing-potion.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ttrpg-dist
          path: dist/
